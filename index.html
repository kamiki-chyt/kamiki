<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神木チャンネル 短縮リンク</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        .bg-blob {
            position: absolute;
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, rgba(220, 38, 38, 0.08) 0%, rgba(249, 115, 22, 0.08) 100%);
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            animation: float 10s ease-in-out infinite alternate;
        }

        @keyframes float {
            0% { transform: translate(-100px, -100px) scale(1); }
            100% { transform: translate(100px, 100px) scale(1.1); }
        }

        .card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 28px;
            padding: 48px 36px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .spinner-wrapper {
            position: relative;
            width: 64px;
            height: 64px;
            margin: 0 auto 24px;
        }

        .spinner {
            width: 100%;
            height: 100%;
            border: 3px solid rgba(226, 232, 240, 0.8);
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .icon-wrapper {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 24px;
            box-shadow: 0 12px 24px rgba(255, 0, 0, 0.25);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .icon-wrapper svg {
            width: 36px;
            height: 36px;
            fill: #ffffff;
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 12px;
            line-height: 1.4;
            letter-spacing: -0.02em;
        }

        p {
            font-size: 15px;
            color: #64748b;
            line-height: 1.6;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 16px 24px;
            margin-top: 24px;
            background: #0f172a;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            border-radius: 16px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.12);
        }

        .btn:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(37, 99, 235, 0.25);
        }
    </style>
</head>
<body>

    <div class="bg-blob"></div>

    <div class="card" id="card">
        <div class="spinner-wrapper" id="spinner-container">
            <div class="spinner"></div>
        </div>
        <h1 id="title">転送先を確認中...</h1>
        <p id="status">しばらくお待ちください。</p>
        <div id="action-area"></div>
    </div>

    <script>
        // ★ご自身のmicroCMSの設定に書き換えてください★
        const MICROCMS_SERVICE_ID = 'YOUR_SERVICE_ID'; 
        const MICROCMS_API_KEY = 'YOUR_API_KEY';       

        async function init() {
            // URLのクエリパラメータ（例: ?v=yt1）を取得
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('v');

            // ① パラメータ（?v=...）がない場合、または空の場合
            if (!slug) {
                showTopPageUI();
                return;
            }

            // ② パラメータがある場合、microCMSに問い合わせて転送
            try {
                const endpoint = `https://${MICROCMS_SERVICE_ID}.microcms.io/api/v1/links?filters=slug[equals]${slug}`;
                const res = await fetch(endpoint, {
                    headers: { 'X-MICROCMS-API-KEY': MICROCMS_API_KEY }
                });

                if (!res.ok) throw new Error('API Error');

                const data = await res.json();

                if (data.contents && data.contents.length > 0 && data.contents[0].destination) {
                    document.getElementById('title').innerText = 'リダイレクトしています...';
                    window.location.replace(data.contents[0].destination);
                } else {
                    showNotFoundUI();
                }
            } catch (err) {
                showNotFoundUI();
            }
        }

        // トップページ（パラメータなし）の表示
        function showTopPageUI() {
            document.getElementById('spinner-container').outerHTML = `
                <div class="icon-wrapper">
                    <svg viewBox="0 0 24 24">
                        <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                    </svg>
                </div>
            `;
            document.getElementById('title').innerText = 'このリンクは神木チャンネルのみで使用している短縮リンクです';
            document.getElementById('status').innerText = '短縮IDが指定されていないか、直接アクセスされています。';
            document.getElementById('action-area').innerHTML = `
                <a href="https://youtube.com/@kamiki-ch?si=QtYWyEDAbs0-nz4a" class="btn" target="_blank" rel="noopener noreferrer">
                    神木チャンネルを見る
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </a>
            `;
        }

        // パラメータはあるが、microCMSに該当データがなかった場合
        function showNotFoundUI() {
            document.getElementById('spinner-container').outerHTML = `
                <div class="icon-wrapper">
                    <svg viewBox="0 0 24 24">
                        <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                    </svg>
                </div>
            `;
            document.getElementById('title').innerText = '指定された短縮リンクは見つかりませんでした';
            document.getElementById('status').innerText = 'URLが間違っているか、すでに削除された可能性があります。';
            document.getElementById('action-area').innerHTML = `
                <a href="https://youtube.com/@kamiki-ch?si=QtYWyEDAbs0-nz4a" class="btn" target="_blank" rel="noopener noreferrer">
                    神木チャンネルを見る
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </a>
            `;
        }

        init();
    </script>
</body>
</html>
